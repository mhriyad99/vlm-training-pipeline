# --- Model ---------------------------------------------------------------
base_model: "unsloth/Qwen3.5-4B"     # switching back based on your 87-image result
load_in_4bit: false                  # 4B in bf16 is tiny (~8GB) — even more headroom than 9B had, no reason to quantize
max_seq_length: 8096                 # re-measure against your actual 409-image labels before locking this in

# --- Image resolution ------------------------------------------------------
image_resize: 2048                   # unchanged

# --- Prompt ----------------------------------------------------------------
prompt_file: "prompts/extraction_prompt.txt"

# --- Dataset -----------------------------------------------------------
dataset:
  images_dir: "dataset/images"
  labels_dir: "dataset/labels"
  image_ext: ".jpg"
  # Held-out split, never trained on. Its only job is to produce an eval_loss
  # each epoch so you can tell which checkpoint to keep instead of assuming the
  # last one is best. Comment both lines out to train with no eval at all.
  holdout_images_dir: "dataset/holdout_images"
  holdout_labels_dir: "dataset/holdout_labels"

# --- LoRA ----------------------------------------------------------------
lora:
  r: 16
  alpha: 16
  dropout: 0.05
  finetune_vision_layers: true
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true

# --- Training --------------------------------------------------------------
training:
  output_dir: "outputs/adapters/run1_4b_409img"   # renamed so you don't overwrite the 87-image run's adapter
  per_device_train_batch_size: 1       # 4B bf16 leaves much more room than 9B did — worth trying 4 first
  gradient_accumulation_steps: 8         # effective batch 8, same as your 9B plan
  num_train_epochs: 3
  learning_rate: 2.0e-4
  warmup_steps: 10                       # ~409/8 ≈ 51 steps/epoch × 3 ≈ 153 total steps — same math as before
  logging_steps: 1
  save_strategy: "epoch"
  seed: 3407
  # --- Eval on the holdout split ---
  # eval_strategy must equal save_strategy for load_best_model_at_end to work;
  # train.py checks this and refuses to start if they diverge, rather than
  # letting the run fail hours in.
  eval_strategy: "epoch"
  per_device_eval_batch_size: 1   # eval peaks lower than training (no grads), but
                                  # 1 keeps it strictly below the training peak
  load_best_model_at_end: true    # saved adapter = lowest eval_loss epoch, not the last
  save_total_limit: 3             # the best checkpoint is always exempt from deletion

# --- Inference -------------------------------------------------------------
inference:
  max_new_tokens: 2048
  temperature: 0.0
